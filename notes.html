<head>
<meta charset="UTF-8" />

<meta property="og:title" content="FO4SO.KNOWLEDGE // 笔记" />
<meta property="og:description" content="FO4SO.KNOWLEDGE 笔记——随记、心得与唠叨。" />
<meta property="og:url" content="https://wz3723.github.io/FO4SO-KNOWLEDGE/notes.html" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<style>
  @font-face{font-family:'Archivo Black';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/ArchivoBlack.woff2') format('woff2');}
  @font-face{font-family:'Staatliches';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/Staatliches.woff2') format('woff2');}
  :root{
    --bg:#0b0b0c;--bg-soft:#101012;--panel:#131315;--panel-2:#161618;
    --border:#26262a;--border-soft:#1d1d20;
    --gold:#e3b04b;--gold-strong:#f2c76b;--gold-dim:#a8873f;
    --crimson:#8e2a26;--crimson-hover:#a63530;--teal:#6fbfa5;
    --text:#d8ccae;--text-soft:#ab9f83;--text-muted:#7d7460;
    --mono:'JetBrains Mono','Fira Code',Consolas,'SF Mono',monospace;
    --sans:'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;}
  ::selection{background:rgba(227,176,75,.25);color:var(--gold-strong);}
  a{color:inherit;text-decoration:none;}
  .nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:24px;padding:12px 28px;background:rgba(11,11,12,.86);backdrop-filter:blur(10px);}
  .nav::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.14) 72%,rgba(255,255,255,0) 100%);pointer-events:none;}
  .brand{font-weight:800;letter-spacing:.04em;font-size:16px;white-space:nowrap;background-image:linear-gradient(180deg,#fff3c2 0%,#ffdd85 35%,#eab54a 65%,#d6982a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 6px rgba(255,221,133,.30));}
  .brand .dot{color:transparent;-webkit-text-fill-color:transparent;}
  .nav-links{display:flex;align-items:center;gap:22px;margin-left:auto;}
  .nav-links a{font-size:14px;color:var(--text-soft);transition:color .15s;white-space:nowrap;}
  .nav-links a:hover{color:var(--gold);}
  .nav-links a.active{color:var(--gold-strong);}
  .nav-icons{display:flex;align-items:center;gap:6px;}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;color:var(--text-soft);transition:background .15s,color .15s;}
  .icon-btn:hover{background:var(--panel);color:var(--gold);}
  .share{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--text-soft);padding:6px 10px;border-radius:8px;transition:background .15s,color .15s;white-space:nowrap;}
  .share:hover{background:var(--panel);color:var(--gold);}

  .wrap{max-width:760px;margin:0 auto;padding:36px 24px 70px;}
  .page-title{font-size:clamp(24px,4vw,34px);font-weight:800;color:#f4f0e0;margin-bottom:6px;text-shadow:0 0 22px rgba(227,176,75,.18);}
  .page-sub{color:var(--text-soft);font-size:15px;margin-bottom:28px;}

  .note{margin-bottom:26px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px 24px;}
  .note .head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:12px;}
  .note .t{font-size:19px;font-weight:800;color:var(--gold);}
  .note .d{font-size:12px;color:var(--text-muted);font-family:var(--mono);white-space:nowrap;}
  .note .body{font-size:15px;color:var(--text-soft);}
  .note .body h2,.note .body h3{color:var(--gold);margin:16px 0 8px;line-height:1.35;}
  .note .body p{margin:12px 0;}
  .note .body ul,.note .body ol{padding-left:22px;margin:12px 0;}
  .note .body li{margin:6px 0;}
  .note .body a{color:var(--gold-strong);text-decoration:underline;}
  .note .body img{max-width:100%;border-radius:8px;margin:12px 0;}
  .note .body blockquote{border-left:3px solid var(--gold-dim);background:var(--bg-soft);padding:12px 16px;margin:14px 0;border-radius:0 8px 8px 0;}
  .note .body pre{background:var(--bg-soft);border:1px solid var(--border);border-radius:8px;padding:12px 14px;overflow:auto;}
  .note .body code{font-family:var(--mono);color:#b8d4c8;}
  .note-empty{color:var(--text-muted);font-size:14px;padding:18px;border:1px dashed var(--border);border-radius:12px;}

  footer{text-align:center;padding:26px 20px 40px;border-top:1px solid var(--border-soft);font-size:13px;color:var(--text-muted);}
  footer .mono{font-family:var(--mono);color:var(--teal);}

  @media (max-width:720px){.nav-links{gap:14px;}.nav-links a{font-size:13px;}}
</style>
</head>
<body>

  <nav class="nav">
    <a class="brand" href="index.html">FO4SO<span class="dot">.</span>KNOWLEDGE</a>
    <div class="nav-links">
      <a href="index.html">首页</a>
      <a href="notes.html" class="active">笔记</a>
      <a href="#">最近更新</a>
      <a href="guide.html">目录</a>
      <a href="submit.html">投稿</a>
      <div class="nav-icons">
        <a class="icon-btn" href="#" aria-label="目录"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/></svg></a>
        <a class="share" href="#" id="shareBtn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v13M8 7l4-4 4 4"/></svg>分享此页</a>
      </div>
    </div>
  </nav>

  <main class="wrap">
    <h1 class="page-title">笔记</h1>
    <p class="page-sub">站长的随笔、开发心得与更新唠叨。之后会陆续补。</p>
    <div id="notesList"></div>
  </main>

  <footer>
    <p class="mono">FO4SO_KNOWLEDGE // VERSION：1.5.6</p>
    <p>用 <a href="#">WZ</a> 构建 · 主题灵感来自终端美学</p>
  </footer>

  <script src="lib/marked.min.js"></script>
  <script>
    // 站长笔记：往下面数组加 {title, date, body} 即可（body 支持 Markdown）
    var NOTES = [
      { title:'欢迎来到 FO4SO.KNOWLEDGE', date:'2026-08-27',
        body:'这里是站长的笔记区，放一些随笔、开发心得与更新唠叨。\n\n示例：支持 **加粗**、- 列表、#### 小标题、> 引用、`代码` 等 Markdown。\n\n> 这是一条示例笔记，你可删除或替换为真实内容。' }
    ];

    (function(){
      var box=document.getElementById('notesList');
      if(!box) return;
      if(!NOTES || !NOTES.length){ box.innerHTML='<div class="note-empty">还没有笔记，站长会陆续写。</div>'; return; }
      if (window.marked) marked.setOptions({ breaks:true, gfm:true });
      box.innerHTML='';
      NOTES.forEach(function(n){
        var el=document.createElement('article'); el.className='note';
        var head='<div class="head"><div class="t">'+esc(n.title)+'</div>'+(n.date?'<div class="d">'+esc(n.date)+'</div>':'')+'</div>';
        var body='<div class="body">'+(window.marked?marked.parse(n.body||''):'<p>'+esc(n.body||'')+'</p>')+'</div>';
        el.innerHTML=head+body;
        box.appendChild(el);
      });
      function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    })();

    // 分享此页：复制链接
    (function(){
      function copy(t){ if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(()=>true).catch(()=>legacy(t)); return Promise.resolve(legacy(t)); }
      function legacy(t){ var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); var ok=false; try{ok=document.execCommand('copy');}catch(e){} document.body.removeChild(ta); return ok; }
      function toast(m){ var el=document.createElement('div'); el.style.cssText='position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:#151517;border:1px solid #a8873f;border-radius:9px;padding:10px 20px;color:#f2c76b;z-index:200;transition:opacity .25s;'; el.textContent=m; document.body.appendChild(el); setTimeout(function(){el.style.opacity='0'; setTimeout(function(){el.remove();},250);},1900); }
      var b=document.getElementById('shareBtn');
      if(b) b.addEventListener('click',function(e){ e.preventDefault(); copy(location.href).then(function(ok){ toast(ok?'链接已复制':'复制失败'); }); });
    })();
  </script>
</body>
</html>
